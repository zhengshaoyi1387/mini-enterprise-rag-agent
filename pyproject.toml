[project]
name = "mini-enterprise-rag-agent"
version = "0.1.0"
description = "一个基于现代 LangChain + Qwen + Chroma 的企业知识库 Agent 示例项目"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.0.0",
    "langchain-chroma>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "chromadb>=1.0.0",
    "pypdf>=4.2.0",
    "docx2txt>=0.8",
    "requests>=2.32.0",
    "jieba>=0.42.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mini-rag = "mini_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mini_rag.infrastructure.db" = ["schema.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
