      或产品流程交叉。员工关系组负责人需要确认请求是否可追溯、是否存在替代方案、是否已经通知相关团队。病假连续超过 3 个工作日需上传医疗证明，事假超过 2
      天需直属负责人和 HRBP 双审批。如果申请内容包含多个目标，例如同时申请账号、预算和外部供应商支持，应拆成多个任务分别审批，避免一个审批结论被误用到其他事项。
      43. 该条款的常见误解是只关注最终审批结果，而忽略过程留痕。员工关系组要求所有关键变更都能回溯到原始申请、审批记录和执行结果。标准工时员工每日有效工时按 8
      小时计算，弹性打卡不等于免考勤。若审批通过但执行结果与申请不一致，执行人需要在 2 个工作日内补充说明；若影响客户或财务数据，则必须同步到风险登记表。
