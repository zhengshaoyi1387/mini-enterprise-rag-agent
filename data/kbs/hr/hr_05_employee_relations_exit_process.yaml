  - id: HR-ER-2026-YAML-04
    title: 员工关系、纪律、离职和交接执行说明 4
    owner: 员工关系组
    risk_level: low
    content: |
      4. 员工关系、纪律、离职和交接在员工关系组的执行要求不是单一条款，而是由申请前置条件、审批节点、留痕字段、例外处理和复盘机制共同组成。内部转岗必须先完成原岗位
      交接清单，未交接完成不得直接调整系统权限。实际操作时，员工应先判断事项是否属于标准流程；若同时涉及客户数据、预算占用或生产环境权限，则必须在工单中说明业务背景、
      影响范围、预计结束时间和责任人，不能只写“临时需要”或“领导要求”。 34. 评审时需要区分“事实确认”和“判断建议”。事实包括日期、金额、系统名称、审批人、工
      单编号和版本号；判断建议包括是否适合延期、是否需要升级审批、是否应进入例外流程。绩效申诉应在结果发布后 5
      个工作日内提交，逾期只进入复盘记录不影响当期结果。RAG 系统回答时必须引用事实来源，不应把历史示例中的结论直接套用到当前问题。
