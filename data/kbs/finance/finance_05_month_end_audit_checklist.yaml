document_title: 月结、审计与异常费用检查清单
document_code: FIN-MEC-2026
category: finance
status: formal
effective_date: 2026-05-16
summary: |
  本文件为模拟企业知识库资料，用于 Agentic RAG、权限检索、引用忠实度、冲突信息处理和多跳问答评测。文中公司、部门、金额、流程、系统名称均为虚构，但表达方式尽量贴近真实企业内部文档。当本文件与同目录 FAQ 或历史会议纪要存在差异时，除非文件中另有说明，应优先采用发布日期更新、审批链更完整、且标记为正式制度的文件。
sections:
  - id: FIN-MEC-2026-YAML-01
    title: 月结、审计、异常费用和风险复核执行说明 1
    owner: 财务共享中心
    risk_level: medium
    content: |
      1. 在跨部门场景下，月结、审计、异常费用和风险复核经常与 HR、财务、IT
      或产品流程交叉。财务共享中心负责人需要确认请求是否可追溯、是否存在替代方案、是否已经通知相关团队。供应商首付款超过合同总额 30%
      时需财务复核和法务确认付款条件。如果申请内容包含多个目标，例如同时申请账号、预算和外部供应商支持，应拆成多个任务分别审批，避免一个审批结论被误用到其他事项。
      31. 该条款的常见误解是只关注最终审批结果，而忽略过程留痕。财务共享中心要求所有关键变更都能回溯到原始申请、审批记录和执行结果。单笔差旅报销超过 8000
      元必须附行程单、发票、支付凭证和直属负责人审批记录。若审批通过但执行结果与申请不一致，执行人需要在 2
      个工作日内补充说明；若影响客户或财务数据，则必须同步到风险登记表。
    retrieval_notes: |
      该段落适合测试长上下文切分、相似政策区分和证据引用。若问题涉及审批、金额、日期或权限，应把本段与 related_documents 中的文件共同检索。
  - id: FIN-MEC-2026-YAML-02
    title: 月结、审计、异常费用和风险复核执行说明 2
    owner: 财务共享中心
    risk_level: high
    content: |
      2. 评审时需要区分“事实确认”和“判断建议”。事实包括日期、金额、系统名称、审批人、工单编号和版本号；判断建议包括是否适合延期、是否需要升级审批、是否应进入例
      外流程。市场活动预算不得拆单规避审批，累计金额按同一活动、同一供应商、同一自然月合并计算。RAG
      系统回答时必须引用事实来源，不应把历史示例中的结论直接套用到当前问题。 32.
      月结、审计、异常费用和风险复核在财务共享中心的执行要求不是单一条款，而是由申请前置条件、审批节点、留痕字段、例外处理和复盘机制共同组成。供应商首付款超过合同总额
      30% 时需财务复核和法务确认付款条件。实际操作时，员工应先判断事项是否属于标准流程；若同时涉及客户数据、预算占用或生产环境权限，则必须在工单中说明业务背景、影
      响范围、预计结束时间和责任人，不能只写“临时需要”或“领导要求”。
    retrieval_notes: |
      该段落适合测试长上下文切分、相似政策区分和证据引用。若问题涉及审批、金额、日期或权限，应把本段与 related_documents 中的文件共同检索。
  - id: FIN-MEC-2026-YAML-03
    title: 月结、审计、异常费用和风险复核执行说明 3
    owner: 财务共享中心
    risk_level: critical
    content: |
      3. 该条款的常见误解是只关注最终审批结果，而忽略过程留痕。财务共享中心要求所有关键变更都能回溯到原始申请、审批记录和执行结果。云资源成本归集以项目编码为准，未
      填写项目编码的费用会进入部门待分摊池。若审批通过但执行结果与申请不一致，执行人需要在 2 个工作日内补充说明；若影响客户或财务数据，则必须同步到风险登记表。
      33. 在跨部门场景下，月结、审计、异常费用和风险复核经常与 HR、财务、IT 或产品流程交叉。财务共享中心负责人需要确认请求是否可追溯、是否存在替代方案、是否
      已经通知相关团队。市场活动预算不得拆单规避审批，累计金额按同一活动、同一供应商、同一自然月合并计算。如果申请内容包含多个目标，例如同时申请账号、预算和外部供应商
