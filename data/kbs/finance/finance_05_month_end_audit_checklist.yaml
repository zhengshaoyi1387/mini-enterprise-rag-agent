    risk_level: medium
    content: |
      13. 在跨部门场景下，月结、审计、异常费用和风险复核经常与 HR、财务、IT
      或产品流程交叉。财务共享中心负责人需要确认请求是否可追溯、是否存在替代方案、是否已经通知相关团队。供应商首付款超过合同总额 30%
      时需财务复核和法务确认付款条件。如果申请内容包含多个目标，例如同时申请账号、预算和外部供应商支持，应拆成多个任务分别审批，避免一个审批结论被误用到其他事项。
      43. 该条款的常见误解是只关注最终审批结果，而忽略过程留痕。财务共享中心要求所有关键变更都能回溯到原始申请、审批记录和执行结果。单笔差旅报销超过 8000
      元必须附行程单、发票、支付凭证和直属负责人审批记录。若审批通过但执行结果与申请不一致，执行人需要在 2
      个工作日内补充说明；若影响客户或财务数据，则必须同步到风险登记表。
